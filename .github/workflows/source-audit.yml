name: Source Drift — Read-only API audit
on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: 'Pinned reltroner-studio commit (blank = resolve main)'
        required: false
      remodeling_sha:
        description: 'Pinned reltroner-studio-remodeling commit (blank = resolve main)'
        required: false
  repository_dispatch:
    types: [reltroner-source-changed]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: source-audit
  cancel-in-progress: false
jobs:
  source-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore immutable Git object cache
        uses: actions/cache@v4
        with:
          path: .cache/github
          key: github-objects-${{ github.run_id }}
          restore-keys: github-objects-
      - name: Read-only pipeline through the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_SHA: ${{ github.event.inputs.production_sha }}
          DRAFT_SHA: ${{ github.event.inputs.remodeling_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${PROD_SHA:-}" ]; then ARGS+=(--production-sha "$PROD_SHA"); fi
          if [ -n "${DRAFT_SHA:-}" ]; then ARGS+=(--remodeling-sha "$DRAFT_SHA"); fi
          node scripts/pipeline.ts "${ARGS[@]}"
      - run: npm test
      - run: npm run build
      - name: Upload audit evidence (CI artifact, not a public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: source-drift-${{ github.run_id }}
          path: |
            artifacts/
            dist/
