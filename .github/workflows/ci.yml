name: Reltroner Statistics — CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  determinism:
    name: P0R determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests (deterministic fixtures)
        run: npm test
      - name: Contract drift check (Zod → JSON Schema)
        run: npm run schemas:check
      - name: Pinned source pair baseline (GitHub API, read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run verify:baseline

  analytics:
    name: Python analytics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analytics/python/requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: python -m pip install --require-hashes -r analytics/python/requirements.lock
      - name: Python tests (incl. XSD validation of exported XML)
        env:
          RELTRONER_PYTHON: python
        run: npm run test:py

  site:
    name: Pipeline, static build and browser tests
    needs: [determinism, analytics]
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analytics/python/requirements.lock
      - run: python -m pip install --require-hashes -r analytics/python/requirements.lock
      - name: Restore immutable Git object cache
        uses: actions/cache@v4
        with:
          path: .cache/github
          key: github-objects-${{ github.run_id }}
          restore-keys: github-objects-
      - name: Read-only analysis pipeline (latest main of both sources, pinned at resolution)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELTRONER_PYTHON: python
        run: npm run pipeline
      - name: Type check
        run: npm run typecheck
      - name: Install Chromium for PDF printing and browser tests
        run: npx playwright install --with-deps chromium
      - name: Static build (pages, PDFs from HTML, CSP headers, link validation)
        run: npm run build
      - name: Browser tests (routes, 4 viewports, themes, a11y, keyboard, exports)
        run: npm run test:e2e
      - name: RC-DEPLOY-01 — upload responsive visual acceptance screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          retention-days: 14
          if-no-files-found: error
      - name: Upload deploy-ready build (CI artifact, not a public deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: |
            dist/
            artifacts/
          retention-days: 14
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish_statistics:
    name: Publish verified main SHA to Statistics custom domain
    needs: [site]
    # A repo variable alone cannot redirect an unrelated Pages project; both values must match.
    # The Cloudflare GET-only preflight additionally checks project identity and its sole active custom domain.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT == 'reltroner-statistics' && vars.SITE_URL == 'https://statistics.reltroner.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: statistics-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
      - name: Reject stale deploys when main advanced
        shell: bash
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo "STALE_DEPLOY_BLOCKED: a newer main commit superseded this build"
            exit 1
          }
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
      - name: Fail closed — GET-only Pages project and exact active custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/guard-pages-target.ts
      - name: Deploy verified static artifact to Statistics Pages only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.161.0 pages deploy dist --project-name reltroner-statistics --branch main --commit-hash "${{ github.sha }}"
      - name: Verify deployed website matches this exact GitHub commit and source digest
        run: node scripts/verify-deployment.ts https://statistics.reltroner.com
