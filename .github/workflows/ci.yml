name: Reltroner Statistics — CI
on:
  push:
    paths-ignore:
      - '**/*.png'
      - '**/*.pdf'
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  determinism:
    name: P0R determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit tests (deterministic fixtures)
        run: npm test
      - name: Pinned source pair baseline (GitHub API, read-only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run verify:baseline
      - name: Build static preview
        run: npm run build
