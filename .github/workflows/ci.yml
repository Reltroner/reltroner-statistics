name: Reltroner Statistics — CI
on:
  push:
    paths-ignore:
      - '**/*.png'
      - '**/*.pdf'
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Upload static baseline preview
        uses: actions/upload-artifact@v4
        with:
          name: reltroner-statistics-static-preview
          path: dist/
